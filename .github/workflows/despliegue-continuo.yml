name: CD # despliegue a Cloud Run — staging desde develop, producción desde main

# CM-156. `main` no admite push directo (CLAUDE.md raíz §3): la única forma de que un
# commit llegue ahí es fusionando un PR, así que "push a main" y "se fusionó el PR de
# promoción a main" son el mismo evento. Mismo patrón que cameia-web
# (despliegue-continuo.yml): un solo trigger de push para ambas ramas, un job por
# ambiente, cada uno con su propia condición de `github.ref`.
on:
  push:
    branches: [develop, main]

concurrency:
  group: cd-gateway-${{ github.ref }}
  cancel-in-progress: false # nunca cancelar un deploy a medias

# Mínimo privilegio: solo lee código y pide el token OIDC para WIF (guía DevOps §2.9).
permissions:
  contents: read
  id-token: write

env:
  REGION: us-east1
  SERVICE: cameia-gateway
  # Repositorio de Artifact Registry ya aprovisionado por Terraform (CM-150).
  AR_REPO: cameia

jobs:
  desplegar-staging:
    name: Build, publicar imagen y desplegar a Cloud Run (staging)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Credencial temporal vía Workload Identity Federation — mismo patrón ya en
      # producción real en cameia-web (despliegue-continuo.yml). La cuenta de servicio
      # (github-action-cameia-backend) es compartida entre gateway/perfil/cuentas, con
      # permisos mínimos (Artifact Registry Writer + Cloud Run Developer) y su binding WIF
      # condicionado a cada repo por separado — ver CM-156.
      - name: Autenticar en GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar Docker contra Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Tag corto (7 caracteres), misma convención de nomenclatura de imagen que la guía
      # DevOps del sprint: <region>-docker.pkg.dev/<proyecto>/<repo>/<componente>:<sha>.
      - name: Calcular tag de imagen
        id: imagen
        run: |
          SHA_CORTO="${GITHUB_SHA::7}"
          IMAGEN="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${SHA_CORTO}"
          echo "imagen=${IMAGEN}" >> "$GITHUB_OUTPUT"

      - name: Build de la imagen
        run: docker build -t "${{ steps.imagen.outputs.imagen }}" .

      - name: Publicar imagen en Artifact Registry
        run: docker push "${{ steps.imagen.outputs.imagen }}"

      # CAMEIA_PERFIL_URL y CAMEIA_CUENTAS_URL no tienen valor por defecto en
      # application.yml (a diferencia de entrevista/voz/auditoria) — sin ellas Spring no
      # arranca. Perfil y Cuentas todavía no están desplegados (tareas futuras), así que
      # se usa el mismo patrón de host que no resuelve ya usado para voz/auditoria en el
      # propio application.yml: el gateway arranca sano y esas rutas responden 503 hasta
      # que la tarea de "wiring final" (después de desplegar Perfil/Cuentas) las apunte a
      # sus URLs reales de Cloud Run. No se inventa una URL de producción.
      - name: Desplegar a Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --image="${{ steps.imagen.outputs.imagen }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --service-account="25798898664-compute@developer.gserviceaccount.com" \
            --set-env-vars="CAMEIA_PERFIL_URL=http://cameia-perfil:8080,CAMEIA_CUENTAS_URL=http://cameia-cuentas:8080"

      - name: URL del servicio desplegado
        run: gcloud run services describe "${{ env.SERVICE }}" --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ env.REGION }}" --format="value(status.url)"

  # No existe todavía un proyecto/VPC de producción separado de staging (mismo
  # cameia-e245f, misma cameia-staging por ahora) — gateway no usa Cloud SQL ni
  # RabbitMQ, así que no depende de esa separación para funcionar, pero SÍ necesita un
  # Cloud Run Service con nombre distinto al de staging: si ambos jobs desplegaran sobre
  # "cameia-gateway", cada push a develop pisaría lo que main acababa de publicar y
  # viceversa. "-prod" es un nombre provisional, no una decisión de arquitectura — se
  # revisa cuando exista un ambiente de producción real separado del de staging.
  desplegar-produccion:
    name: Build, publicar imagen y desplegar a Cloud Run (producción)
    # Solo corre cuando el push aterriza en main — y a main solo se llega fusionando un
    # PR (ver comentario de "on:" arriba), nunca por push directo.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Environment "production" de GitHub: pausa el job hasta que alguien del equipo
    # cameia-devops lo apruebe (mismo patrón que cameia-web) — la separación real entre
    # "se fusionó a main" y "ya se desplegó de verdad" vive acá, no en el trigger.
    environment: production
    env:
      # Nombre de servicio distinto al de staging ("cameia-gateway") — ver el
      # comentario de arriba del job: evita que un job le pise el despliegue al otro.
      SERVICE_PROD: cameia-gateway-prod
    steps:
      # Trae el código del commit que llegó a main — idéntico al paso de staging,
      # nada que cambie entre ambientes acá.
      - name: Checkout
        uses: actions/checkout@v7

      # Misma cuenta de servicio compartida (github-action-cameia-backend) y mismo
      # mecanismo WIF que el job de staging — el detalle completo de por qué está en el
      # comentario de ese paso, arriba en este mismo archivo. No hay una identidad de
      # despliegue distinta para producción: es la misma, con permisos ya mínimos.
      - name: Autenticar en GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # Deja el binario "gcloud" listo para usar, ya con la sesión del paso anterior.
      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Sin este paso, "docker push" de más abajo no sabe autenticarse contra
      # Artifact Registry y falla con 401/403.
      - name: Autenticar Docker contra Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Mismo tag corto (7 caracteres del SHA) que staging — la convención de nombre de
      # imagen de la guía DevOps no distingue por ambiente, solo por componente y commit.
      - name: Calcular tag de imagen
        id: imagen
        run: |
          SHA_CORTO="${GITHUB_SHA::7}"
          IMAGEN="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${SHA_CORTO}"
          echo "imagen=${IMAGEN}" >> "$GITHUB_OUTPUT"

      # Reconstruye la imagen desde el mismo Dockerfile — a propósito no se reutiliza la
      # imagen ya construida en staging: el tag de imagen es por SHA de commit, y el SHA
      # que llega a main (el del merge commit de la promoción) es distinto al que se
      # construyó en develop, así que igual haría falta un build nuevo.
      - name: Build de la imagen
        run: docker build -t "${{ steps.imagen.outputs.imagen }}" .

      # Publica la imagen de producción en el mismo repositorio de Artifact Registry que
      # staging (un solo "cameia", ya aprovisionado por Terraform) — se distinguen por
      # tag, no por repositorio separado.
      - name: Publicar imagen en Artifact Registry
        run: docker push "${{ steps.imagen.outputs.imagen }}"

      # Mismas variables de marcador temporal que en staging para CAMEIA_PERFIL_URL y
      # CAMEIA_CUENTAS_URL (ver el comentario completo en el paso equivalente del job de
      # staging, arriba): Perfil y Cuentas tampoco tienen todavía un despliegue de
      # producción, así que no hay una URL real que poner aquí sin inventarla. Cambia
      # solo el nombre del servicio (SERVICE_PROD) frente al paso de staging.
      - name: Desplegar a Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE_PROD }}" \
            --image="${{ steps.imagen.outputs.imagen }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --service-account="25798898664-compute@developer.gserviceaccount.com" \
            --set-env-vars="CAMEIA_PERFIL_URL=http://cameia-perfil:8080,CAMEIA_CUENTAS_URL=http://cameia-cuentas:8080"

      # Imprime la URL real en el log del job — es la evidencia que se enlaza en el PR y
      # en Jira (CLAUDE.md raíz §9): no alcanza con decir "se desplegó", hace falta el
      # artefacto real.
      - name: URL del servicio desplegado
        run: gcloud run services describe "${{ env.SERVICE_PROD }}" --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ env.REGION }}" --format="value(status.url)"
