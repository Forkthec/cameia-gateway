name: CD # despliegue a Cloud Run — staging desde develop, producción desde main

# CM-156. `main` no admite push directo (CLAUDE.md raíz §3): la única forma de que un
# commit llegue ahí es fusionando un PR, así que "push a main" y "se fusionó el PR de
# promoción a main" son el mismo evento.
#
# Staging construye la imagen desde el código y la publica (desplegar-servicio.yml,
# workflow reutilizable). Producción NO reconstruye: la guía DevOps del sprint lo exige
# explícito ("producción debe desplegar exactamente los mismos digest, nunca reconstruir
# el código entre ambientes") — así que el job de abajo busca el digest inmutable de la
# imagen que YA se construyó y probó en staging, y despliega exactamente esa.
#
# Staging se dispara con workflow_run del workflow "CI" de este mismo repo, no con push
# directo a develop: así el despliegue nunca corre sobre un commit cuyas pruebas
# fallaron (disparado directo por push, el job de pruebas y el de despliegue correrían
# en paralelo sobre el mismo evento, sin que uno esperara al otro). github.sha no sirve
# dentro de un workflow disparado por workflow_run — apunta a la punta de la rama en el
# momento del evento, no al commit que realmente terminó de pasar las pruebas — por eso
# el job de staging pasa github.event.workflow_run.head_sha como input `sha` al workflow
# reutilizable, en vez de dejar que este lea GITHUB_SHA por su cuenta.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]

concurrency:
  group: cd-gateway-${{ github.ref }}
  cancel-in-progress: false # nunca cancelar un deploy a medias

permissions:
  contents: read
  id-token: write

jobs:
  staging:
    name: Staging (develop)
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/desplegar-servicio.yml
    with:
      ambiente: staging
      servicio: cameia-gateway
      min_instances: 0
      sha: ${{ github.event.workflow_run.head_sha }}

  # Nombre de servicio distinto al de staging: sin esto, cada push a develop/main se
  # pisaría el despliegue del otro. "-prod" es provisional hasta que exista un
  # ambiente de producción real (proyecto/VPC separados de cameia-staging).
  produccion:
    name: Producción (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVICE_PROD: cameia-gateway-prod
    steps:
      # fetch-depth 0: hace falta el historial completo para leer los dos padres del
      # commit de fusión (ver paso siguiente), no solo el último commit.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # El PR de promoción develop→main se fusiona con "Merge commit" (CLAUDE.md raíz
      # §3), nunca squash — así que el commit que llega a main tiene dos padres: el
      # main anterior, y la punta de develop que ya se construyó y probó en staging
      # (job de arriba). Ese segundo padre es el commit cuyo SHA corto ya es el tag de
      # la imagen que hay que promover, no reconstruir.
      - name: Resolver el commit de develop que se promueve
        id: origen
        run: |
          SHA_DEVELOP=$(git rev-parse HEAD^2)
          echo "sha_corto=${SHA_DEVELOP::7}" >> "$GITHUB_OUTPUT"

      - name: Autenticar en GCP (WIF)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v3

      # Digest inmutable (sha256:...) de la imagen que el job de staging ya publicó
      # con ese mismo SHA de commit como tag — no se descarga ni se reconstruye nada,
      # solo se consulta cuál es. roles/artifactregistry.writer ya incluye lectura.
      - name: Resolver el digest de la imagen ya probada en staging
        id: imagen
        run: |
          TAG="us-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cameia/cameia-gateway:${{ steps.origen.outputs.sha_corto }}"
          DIGEST=$(gcloud artifacts docker images describe "$TAG" --format="value(image_summary.digest)")
          echo "imagen=us-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cameia/cameia-gateway@${DIGEST}" >> "$GITHUB_OUTPUT"

      # Mismo marcador temporal para CAMEIA_PERFIL_URL/CAMEIA_CUENTAS_URL que en
      # staging: Perfil y Cuentas tampoco tienen despliegue de producción todavía.
      #
      # --service-account: misma identidad de ejecución dedicada que usa staging (ver
      # desplegar-servicio.yml) -- producción necesita el mismo permiso de invocación
      # sobre sus propios destinos de producción, cuando estos existan.
      - name: Desplegar a Cloud Run (mismo digest de staging, sin reconstruir)
        run: |
          gcloud run deploy "${{ env.SERVICE_PROD }}" \
            --image="${{ steps.imagen.outputs.imagen }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region=us-east1 \
            --platform=managed \
            --min-instances=0 \
            --max-instances=2 \
            --service-account="cameia-gateway-run@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-env-vars="CAMEIA_PERFIL_URL=http://cameia-perfil:8080,CAMEIA_CUENTAS_URL=http://cameia-cuentas:8080"

      - name: URL del servicio desplegado
        run: gcloud run services describe "${{ env.SERVICE_PROD }}" --project="${{ vars.GCP_PROJECT_ID }}" --region=us-east1 --format="value(status.url)"
